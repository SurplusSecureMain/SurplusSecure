<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 360" width="630" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="630" height="360" fill="#FFFFFF"/>
  <!-- Gold accent line at top -->
  <rect x="0" y="0" width="630" height="5" fill="#C9943E"/>
  <!-- Logo Mark -->
  <rect x="40" y="40" width="56" height="56" rx="12" fill="#1B2A4A"/>
  <text x="68" y="78" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" font-weight="700" fill="#C9943E">SS</text>
  <!-- Logo Text -->
