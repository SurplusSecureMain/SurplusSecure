  <text x="206" y="65" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#C9943E">Secure</text>
  <!-- Divider -->
  <line x1="40" y1="115" x2="590" y2="115" stroke="#E8E4DD" stroke-width="1"/>
  <!-- Name -->
  <text x="40" y="155" font-family="'DM Serif Display', Georgia, serif" font-size="28" font-weight="400" fill="#1B2A4A">Kelli Meeks</text>
