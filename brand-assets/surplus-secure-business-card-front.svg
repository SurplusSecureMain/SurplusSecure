  <text x="40" y="248" font-family="'DM Sans', Helvetica, sans-serif" font-size="12" fill="#C9943E" font-weight="700">E</text>
  <text x="58" y="248" font-family="'DM Sans', Helvetica, sans-serif" font-size="12" fill="#3A4560">surplussecure@gmail.com</text>
  <text x="40" y="271" font-family="'DM Sans', Helvetica, sans-serif" font-size="12" fill="#C9943E" font-weight="700">W</text>
  <text x="58" y="271" font-family="'DM Sans', Helvetica, sans-serif" font-size="12" fill="#3A4560">surplus-secure.com</text>
