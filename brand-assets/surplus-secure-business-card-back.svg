<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 360" width="630" height="360">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@400;500;700&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="630" height="360" fill="#1B2A4A"/>
  <!-- Gold accent line at bottom -->
  <rect x="0" y="355" width="630" height="5" fill="#C9943E"/>
  <!-- Large Logo Mark centered -->
  <rect x="265" y="70" width="100" height="100" rx="22" fill="#C9943E" opacity="0.15"/>
  <text x="315" y="140" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="50" font-weight="700" fill="#C9943E">SS</text>
  <!-- Wordmark -->
  <text x="315" y="210" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="30" fill="#FFFFFF">Surplus <tspan fill="#C9943E">Secure</tspan></text>
  <!-- Tagline -->
  <text x="315" y="245" text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif" font-size="12" fill="#8A98B4" letter-spacing="2">MICHIGAN TAX FORECLOSURE RECOVERY</text>
  <!-- Value prop -->
  <text x="315" y="300" text-anchor="middle" font-family="'DM Sans', Helvetica, sans-serif" font-size="13" font-style="italic" fill="#C9943E">This money is yours. We're on your side.</text>
</svg>
