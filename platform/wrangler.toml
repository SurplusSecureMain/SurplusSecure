name = "surplus-secure-platform"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
APP_PASSWORD = ""  # Set via: wrangler secret put APP_PASSWORD

# KV Namespaces — create with:
#   wrangler kv:namespace create CONTENT
#   wrangler kv:namespace create DATA
[[kv_namespaces]]
binding = "CONTENT"
id = "0df9acd7ac6a4ccf97967b00af48605c"  # surplus-secure-content

[[kv_namespaces]]
binding = "DATA"
id = "4c0e187f29874f7db7410174e264041a"  # surplus-secure-data
