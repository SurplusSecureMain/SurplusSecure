name: Deploy Surplus Secure Platform
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed initial data
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -X POST "https://surplus-secure-platform.${WORKER_SUBDOMAIN}.workers.dev/api/seed" \
            -H "Cookie: ss_auth=$(echo -n '${{ secrets.APP_PASSWORD }}:'$(date +%s) | base64)"
        env:
          WORKER_SUBDOMAIN: ${{ secrets.CF_SUBDOMAIN }}
